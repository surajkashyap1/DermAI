services:
  - type: web
    name: dermai-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    # TensorFlow + torch + FAISS need memory; use at least a Standard instance.
    plan: standard
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false            # set this in the Render dashboard (secret)
      - key: DERMAI_GROQ_MODEL
        value: openai/gpt-oss-20b
